name: Arabic AI iPaaS Integration Build

on:
  pull_request:
    branches:
      - product/arabic-ai-ipaas-database-v0.1
    paths:
      - 'factory/tasks/arabic-ai-ipaas-integration-v0.1.md'
      - '.github/workflows/arabic-ai-ipaas-integration-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  antigravity-integration-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTIGRAVITY_API_KEY: ${{ secrets.OGROUP_ANTIGRAVITY_API_KEY }}
      PRODUCT_BASE_BRANCH: product/arabic-ai-ipaas-database-v0.1

    steps:
      - name: Checkout integration trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Antigravity key
        shell: bash
        run: |
          if [ -z "$ANTIGRAVITY_API_KEY" ]; then
            echo "::error::OGROUP_ANTIGRAVITY_API_KEY is not configured."
            exit 20
          fi

      - name: Build integration with Antigravity
        id: build
        shell: bash
        run: |
          set -euo pipefail

          REQUEST_JSON="$(jq -n --rawfile prompt factory/tasks/arabic-ai-ipaas-integration-v0.1.md '{
            agent: "antigravity-preview-09-2026",
            input: $prompt,
            environment: {
              type: "remote",
              sources: [{
                type: "repository",
                source: "https://github.com/alnatourm/ogroup-ai-factory",
                target: "/workspace/ogroup-ai-factory"
              }]
            },
            agent_config: {
              type: "antigravity",
              max_total_tokens: 120000
            },
            store: true
          }')"

          curl --fail-with-body -sS --max-time 1500             -X POST "https://generativelanguage.googleapis.com/v1beta/interactions"             -H "Content-Type: application/json"             -H "x-goog-api-key: $ANTIGRAVITY_API_KEY"             -H "Api-Revision: 2026-05-20"             -d "$REQUEST_JSON"             -o /tmp/antigravity-response.json

          STATUS="$(jq -r '.status // "unknown"' /tmp/antigravity-response.json)"
          INTERACTION_ID="$(jq -r '.id // empty' /tmp/antigravity-response.json)"
          ENVIRONMENT_ID="$(jq -r '.environment_id // empty' /tmp/antigravity-response.json)"

          echo "interaction_id=$INTERACTION_ID" >> "$GITHUB_OUTPUT"
          echo "environment_id=$ENVIRONMENT_ID" >> "$GITHUB_OUTPUT"

          if [ -z "$ENVIRONMENT_ID" ]; then
            echo "::error::No environment_id returned."
            exit 30
          fi

          if [ "$STATUS" = "incomplete" ]; then
            CONTINUE_JSON="$(jq -n               --arg environment "$ENVIRONMENT_ID"               --arg task "Continue from the current sandbox. Finish the highest-priority missing integration items, run backend tests and frontend typecheck/lint/test/build, repair concrete failures only, and preserve completed work. Do not restart or redesign."               '{
                agent: "antigravity-preview-09-2026",
                environment: $environment,
                input: $task,
                agent_config: { type: "antigravity", max_total_tokens: 80000 },
                store: true
              }')"

            HTTP_CODE="$(curl -sS --max-time 1200               -o /tmp/antigravity-response-pass-1.json               -w "%{http_code}"               -X POST "https://generativelanguage.googleapis.com/v1beta/interactions"               -H "Content-Type: application/json"               -H "x-goog-api-key: $ANTIGRAVITY_API_KEY"               -H "Api-Revision: 2026-05-20"               -d "$CONTINUE_JSON")"

            if [ "$HTTP_CODE" = "429" ]; then
              echo "::warning::Antigravity rate limit reached. Preserving partial integration work."
              STATUS="incomplete"
            elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              STATUS="$(jq -r '.status // "unknown"' /tmp/antigravity-response-pass-1.json)"
            else
              echo "::error::Continuation failed with HTTP $HTTP_CODE"
              exit 32
            fi
          fi

          if [ "$STATUS" = "completed" ]; then
            echo "build_status=READY_FOR_REVIEW" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "incomplete" ]; then
            echo "build_status=PARTIAL_READY" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected Antigravity status: $STATUS"
            exit 31
          fi

      - name: Download Antigravity sandbox
        shell: bash
        run: |
          set -euo pipefail
          ENVIRONMENT_ID="${{ steps.build.outputs.environment_id }}"
          mkdir -p /tmp/antigravity-snapshot

          HTTP_CODE="$(curl -L -sS --max-time 300             -o /tmp/antigravity-snapshot.tar             -w "%{http_code}"             "https://generativelanguage.googleapis.com/v1beta/environments/$ENVIRONMENT_ID/files?alt=media"             -H "x-goog-api-key: $ANTIGRAVITY_API_KEY")"

          if [ "$HTTP_CODE" = "404" ]; then
            HTTP_CODE="$(curl -L -sS --max-time 300               -o /tmp/antigravity-snapshot.tar               -w "%{http_code}"               "https://generativelanguage.googleapis.com/v1beta/files/environment-$ENVIRONMENT_ID:download?alt=media"               -H "x-goog-api-key: $ANTIGRAVITY_API_KEY")"
          fi

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Unable to download sandbox. HTTP $HTTP_CODE"
            exit 42
          fi

          tar -xf /tmp/antigravity-snapshot.tar -C /tmp/antigravity-snapshot
          REPO_DIR="$(find /tmp/antigravity-snapshot -type d -path "*/workspace/ogroup-ai-factory" -print -quit)"

          if [ -z "$REPO_DIR" ]; then
            echo "::error::Repository root not found in downloaded sandbox."
            exit 40
          fi

          echo "REPO_DIR=$REPO_DIR" >> "$GITHUB_ENV"

      - name: Create governed integration branch
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_BRANCH="build/arabic-ai-ipaas-integration-v0.1-${GITHUB_RUN_ID}"
          git fetch origin "$PRODUCT_BASE_BRANCH"
          git checkout -B "$OUTPUT_BRANCH" "origin/$PRODUCT_BASE_BRANCH"

          for TARGET in apps/arabic-ai-ipaas-api apps/arabic-ai-ipaas-web; do
            if [ -d "$REPO_DIR/$TARGET" ]; then
              rm -rf "$TARGET"
              mkdir -p "$(dirname "$TARGET")"
              cp -R "$REPO_DIR/$TARGET" "$TARGET"
            fi
          done

          if [ -f "$REPO_DIR/products/arabic-ai-ipaas/INTEGRATION_REPORT.md" ]; then
            mkdir -p products/arabic-ai-ipaas
            cp "$REPO_DIR/products/arabic-ai-ipaas/INTEGRATION_REPORT.md" products/arabic-ai-ipaas/INTEGRATION_REPORT.md
          elif [ -f "$REPO_DIR/apps/arabic-ai-ipaas-api/INTEGRATION_REPORT.md" ]; then
            cp "$REPO_DIR/apps/arabic-ai-ipaas-api/INTEGRATION_REPORT.md" apps/arabic-ai-ipaas-api/INTEGRATION_REPORT.md
          fi

          mkdir -p factory/status
          jq -n             --arg status "${{ steps.build.outputs.build_status }}"             --arg interactionId "${{ steps.build.outputs.interaction_id }}"             --arg sourceRun "$GITHUB_RUN_ID"             '{
              schemaVersion: 1,
              productId: "arabic-ai-ipaas",
              stage: "INTEGRATION_BUILD",
              status: $status,
              provider: "google-antigravity",
              interactionId: $interactionId,
              sourceWorkflowRun: $sourceRun
            }' > factory/status/arabic-ai-ipaas-integration-build.latest.json

          git config user.name "OGroup AI Factory"
          git config user.email "factory@ogroup.ai"
          git add apps/arabic-ai-ipaas-api apps/arabic-ai-ipaas-web products/arabic-ai-ipaas factory/status/arabic-ai-ipaas-integration-build.latest.json

          if git diff --cached --quiet; then
            echo "::error::Antigravity returned no integration changes."
            exit 41
          fi

          git commit -m "build(arabic-ai-ipaas): integration v0.1 from Antigravity"
          git push origin "$OUTPUT_BRANCH"
          echo "OUTPUT_BRANCH=$OUTPUT_BRANCH" >> "$GITHUB_ENV"

      - name: Open integration review PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create             --base "$PRODUCT_BASE_BRANCH"             --head "$OUTPUT_BRANCH"             --title "Arabic AI iPaaS: integration build v0.1"             --body "Autonomous Integration Build Agent output. Source: Google Antigravity. Status: ${{ steps.build.outputs.build_status }}. Factory review, security, tests, and deployment gates are required before merge."             || echo "::warning::Output branch pushed; PR creation is not permitted for GitHub Actions and can be created by the Factory orchestrator."
