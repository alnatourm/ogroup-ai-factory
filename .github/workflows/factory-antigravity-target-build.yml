name: Factory Antigravity Target Build
on:
  repository_dispatch:
    types: [factory-antigravity-build]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANTIGRAVITY_API_KEY: ${{ secrets.OGROUP_ANTIGRAVITY_API_KEY }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.targetRepository }}
      SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
      RUN_ID: ${{ github.event.client_payload.runId }}
      FACTORY_BUILD_SLICE: ${{ github.event.client_payload.buildSlice || 'dashboard-shell-home' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Factory-owned Antigravity credential
        run: test -n "$ANTIGRAVITY_API_KEY"

      - name: Checkout public target source
        run: git clone --depth 1 "https://github.com/$TARGET_REPOSITORY.git" /tmp/factory-target

      - name: Run governed Antigravity build
        id: antigravity
        continue-on-error: true
        run: node scripts/antigravity-target-build.mjs /tmp/factory-target /tmp/factory-antigravity-result.json

      - name: Publish Antigravity terminal diagnostics
        if: steps.antigravity.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/factory-antigravity-result.json ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/factory-antigravity-result.json','utf8'));console.log(JSON.stringify({type:'FACTORY_ANTIGRAVITY_DIAGNOSTIC',interactionId:p.interactionId,status:p.status,diagnostics:p.diagnostics||{}}))"
            {
              printf 'FACTORY_ANTIGRAVITY_DIAGNOSTIC %s\n' "$RUN_ID"
              cat /tmp/factory-antigravity-result.json
            } > /tmp/diagnostic-comment.txt
            gh issue comment "$SOURCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostic-comment.txt
          fi

      - name: Fail workflow when Antigravity did not complete
        if: steps.antigravity.outcome == 'failure'
        run: exit 1

      - name: Publish machine build payload to Factory work item
        if: steps.antigravity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c /tmp/factory-antigravity-result.json | base64 -w0 > /tmp/payload.b64
          BUILD_ID="$GITHUB_RUN_ID"
          split -b 50000 -d -a 3 /tmp/payload.b64 /tmp/chunk-
          TOTAL="$(find /tmp -maxdepth 1 -name 'chunk-*' | wc -l | tr -d ' ')"
          INDEX=0
          for FILE in /tmp/chunk-*; do
            INDEX=$((INDEX+1))
            BODY="FACTORY_ANTIGRAVITY_RESULT $RUN_ID $BUILD_ID $INDEX/$TOTAL"
            gh issue comment "$SOURCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          done
          gh issue comment "$SOURCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "FACTORY_ANTIGRAVITY_READY $RUN_ID $FACTORY_BUILD_SLICE $BUILD_ID"
\n'"$(cat "$FILE")"
            gh issue comment "$SOURCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          done
          gh issue comment "$SOURCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "FACTORY_ANTIGRAVITY_READY $RUN_ID $FACTORY_BUILD_SLICE $BUILD_ID"
