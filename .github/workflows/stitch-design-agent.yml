name: Stitch Design Agent

on:
  push:
    branches: [main]
    paths:
      - 'factory/design-requests/**'
      - 'factory/design-triggers/**'
      - '.github/workflows/stitch-design-agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'factory/design-requests/**'
      - 'factory/design-triggers/**'
      - '.github/workflows/stitch-design-agent.yml'
  workflow_dispatch:
    inputs:
      request_path:
        description: Path to a Factory Design Agent request JSON file
        required: true
        default: factory/design-requests/arabic-ai-ipaas.v0.1.json

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}

    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Stitch configuration
        shell: bash
        run: |
          if [ -z "$STITCH_API_KEY" ]; then
            echo "NEEDS_FACTORY_CONFIGURATION: STITCH_API_KEY is not configured."
            exit 1
          fi

      - name: Resolve Design Request Path
        id: request
        shell: bash
        env:
          DISPATCH_REQUEST_PATH: ${{ inputs.request_path || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          REQUEST_PATH="$DISPATCH_REQUEST_PATH"
          if [ -z "$REQUEST_PATH" ] && [ "$EVENT_NAME" = "push" ]; then
            REQUEST_PATH="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'factory/design-requests/*.json' | tail -n 1)"
          fi
          if [ -z "$REQUEST_PATH" ]; then
            echo "No explicit or changed design request could be resolved."
            exit 1
          fi
          case "$REQUEST_PATH" in
            factory/design-requests/*.json) ;;
            *)
              echo "Invalid request path: $REQUEST_PATH"
              exit 1
              ;;
          esac
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"
          test -f "$REQUEST_PATH"

      - name: Run Design Agent
        id: design
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx packages/stitch-design-adapter/src/cli.ts "${{ steps.request.outputs.request_path }}" > stitch-design-result.json 2> >(tee stitch-design-error.log >&2)

      - name: Run Design Review Agent
        id: review
        if: steps.design.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx tsx packages/design-review-agent/src/cli.ts "${{ steps.request.outputs.request_path }}" stitch-design-result.json design-review-result.json

      - name: Record Design Agent status
        if: always()
        shell: bash
        env:
          DESIGN_OUTCOME: ${{ steps.design.outcome }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          mkdir -p factory/status
          if [ "$DESIGN_OUTCOME" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi
          ERROR_MESSAGE=""
          if [ -f stitch-design-error.log ]; then
            ERROR_MESSAGE="$(tail -n 20 stitch-design-error.log | tr '\n' ' ' | sed 's/"/\\\"/g')"
          fi
          node - <<'NODE'
          const fs = require('fs');
          const status = process.env.DESIGN_OUTCOME === 'success' ? 'SUCCESS' : 'FAILED';
          const error = fs.existsSync('stitch-design-error.log')
            ? fs.readFileSync('stitch-design-error.log', 'utf8').trim().slice(-4000)
            : '';
          const payload = {
            workflow: 'Stitch Design Agent',
            status,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            commitSha: process.env.GITHUB_SHA,
            requestPath: process.env.REQUEST_PATH,
            resultArtifactExpected: status === 'SUCCESS',
            error: error || null
          };
          fs.writeFileSync('factory/status/stitch-design-agent.latest.json', JSON.stringify(payload, null, 2) + '\n');
          NODE

      - name: Record Design Review status
        if: always()
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          mkdir -p factory/status
          node - <<'NODE'
          const fs = require('fs');
          let review = null;
          if (fs.existsSync('design-review-result.json')) {
            review = JSON.parse(fs.readFileSync('design-review-result.json', 'utf8'));
          }
          const payload = {
            workflow: 'Design Review Agent',
            status: review?.status ?? (process.env.REVIEW_OUTCOME === 'skipped' ? 'NOT_RUN' : 'FAILED'),
            score: review?.score ?? null,
            projectId: review?.projectId ?? null,
            summary: review?.summary ?? null,
            blockingIssues: review?.blockingIssues ?? [],
            secretEvidence: (review?.screens ?? [])
              .filter((screen) => Array.isArray(screen.secretEvidence) && screen.secretEvidence.length > 0)
              .map((screen) => ({ key: screen.key, evidence: screen.secretEvidence })),
            limitations: review?.limitations ?? [],
            runId: process.env.GITHUB_RUN_ID,
            commitSha: process.env.GITHUB_SHA
          };
          fs.writeFileSync('factory/status/design-review-agent.latest.json', JSON.stringify(payload, null, 2) + '\n');
          NODE

      - name: Publish Design Agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-design-result
          path: |
            stitch-design-result.json
            stitch-design-error.log
            design-review-result.json
            factory/status/stitch-design-agent.latest.json
            factory/status/design-review-agent.latest.json
          if-no-files-found: warn

      - name: Persist Factory status
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "ogroup-ai-factory"
          git config user.email "actions@users.noreply.github.com"
          git add factory/status/stitch-design-agent.latest.json factory/status/design-review-agent.latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(factory): record Stitch Design Agent status [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Failed to persist status after concurrency-safe retries."
          exit 1

      - name: Enforce Design Agent result
        if: steps.design.outcome != 'success'
        run: exit 1

      - name: Enforce Design Review result
        if: steps.design.outcome == 'success' && steps.review.outcome != 'success'
        run: exit 1
