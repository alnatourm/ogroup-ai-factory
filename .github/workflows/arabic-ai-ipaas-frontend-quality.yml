name: Arabic AI iPaaS Frontend Quality

on:
  pull_request:
    branches:
      - product/arabic-ai-ipaas-database-v0.1
    paths:
      - 'apps/arabic-ai-ipaas-web/**'
      - '.github/workflows/arabic-ai-ipaas-frontend-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/arabic-ai-ipaas-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/arabic-ai-ipaas-web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
