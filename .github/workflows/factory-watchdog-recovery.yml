name: Factory Watchdog Recovery

on:
  repository_dispatch:
    types:
      - factory-watchdog-continue
      - factory-watchdog-retry
      - factory-watchdog-fallback

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: factory-watchdog-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Factory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Mark Factory work RUNNING
        if: startsWith(github.event.client_payload.runId, 'factory-work:')
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(context.payload.client_payload.runId.split(':')[1]);
            const { owner, repo } = context.repo;
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = issue.data.labels.map(x => typeof x === 'string' ? x : x.name).filter(Boolean).filter(x => !x.startsWith('factory-status:'));
            labels.push('factory-work', 'factory-status:running');
            await github.rest.issues.setLabels({ owner, repo, issue_number, labels });
            await github.rest.issues.createComment({ owner, repo, issue_number, body: 'Factory Watchdog started verification. Verification alone cannot complete implementation work. Workflow run: ' + context.runId });

      - name: Execute deterministic Factory verification
        run: npm test

      - name: Keep implementation work open after verification
        if: success() && startsWith(github.event.client_payload.runId, 'factory-work:')
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(context.payload.client_payload.runId.split(':')[1]);
            const { owner, repo } = context.repo;
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = issue.data.labels.map(x => typeof x === 'string' ? x : x.name).filter(Boolean).filter(x => !x.startsWith('factory-status:'));
            labels.push('factory-work', 'factory-status:waiting-dependency');
            await github.rest.issues.setLabels({ owner, repo, issue_number, labels });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: 'Deterministic verification passed, but this work item remains OPEN. Implementation evidence and a merged implementation PR are required before completion. Waiting for the build executor.'
            });

      - name: Record recovery event
        env:
          EVENT_NAME: ${{ github.event.action }}
          RUN_ID: ${{ github.event.client_payload.runId }}
        run: |
          echo "WATCHDOG_RECOVERY_ACCEPTED event=$EVENT_NAME runId=$RUN_ID"
          echo "Verification is evidence, not implementation completion."
