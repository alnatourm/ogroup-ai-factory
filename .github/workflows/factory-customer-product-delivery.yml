name: Factory Customer Product Delivery

on:
  repository_dispatch:
    types:
      - factory-customer-deliver

permissions:
  contents: read
  issues: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_GITHUB_TOKEN: ${{ secrets.FACTORY_TARGET_GITHUB_TOKEN }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.targetRepository }}
      SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
      RUN_ID: ${{ github.event.client_payload.runId }}
      TENANT_ID: ${{ github.event.client_payload.tenant }}
      FACTORY_CONTROL_API_URL: ${{ secrets.FACTORY_CONTROL_API_URL }}
      FACTORY_CALLBACK_TOKEN: ${{ secrets.FACTORY_CALLBACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require delivery context
        run: |
          test -n "$TARGET_GITHUB_TOKEN"
          test -n "$TARGET_REPOSITORY"
          test -n "$SOURCE_ISSUE"
          test -n "$RUN_ID"
      - name: Clone customer repository
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TARGET_GITHUB_TOKEN }}
        run: gh repo clone "$TARGET_REPOSITORY" /tmp/customer-product
      - name: Apply generated product payload
        run: node scripts/apply-customer-build-result.mjs /tmp/customer-product
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
      - name: Verify customer product
        working-directory: /tmp/customer-product
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            echo "VERIFIED_STACK=node" >> "$GITHUB_ENV"
            echo "VERIFIED_CHECKS=dependencies,lint-if-present,typecheck-if-present,test-if-present,build-if-present" >> "$GITHUB_ENV"
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "VERIFIED_STACK=python" >> "$GITHUB_ENV"
            echo "VERIFIED_CHECKS=compileall,dependencies-if-present,pytest-if-present" >> "$GITHUB_ENV"
            python -m compileall -q .
            if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
            if [ -d tests ]; then python -m pytest -q; fi
          else
            echo "Unsupported customer product: no package.json, pyproject.toml, or requirements.txt"
            exit 1
          fi
      - name: Commit verified product
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TARGET_GITHUB_TOKEN }}
        working-directory: /tmp/customer-product
        run: |
          git config user.name "OGroup AI Factory"
          git config user.email "factory@ogroup.ai"
          git add -A
          git diff --cached --quiet && { echo "No implementation change"; exit 1; }
          git commit -m "build: verified customer product $RUN_ID"
          git push origin HEAD:main
      - name: Persist verified testing evidence
        if: env.FACTORY_CONTROL_API_URL != '' && env.FACTORY_CALLBACK_TOKEN != '' && env.TENANT_ID != ''
        working-directory: /tmp/customer-product
        run: node "$GITHUB_WORKSPACE/scripts/report-customer-evidence.mjs"
      - name: Request verified deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$SOURCE_ISSUE" --repo "${{ github.repository }}" --body "FACTORY_DEPLOYMENT_REQUESTED $RUN_ID
          Repository: $TARGET_REPOSITORY
          Commit: $(git -C /tmp/customer-product rev-parse HEAD)
          Verification workflow: $GITHUB_RUN_ID"
      - name: Record delivery failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$SOURCE_ISSUE" --repo "${{ github.repository }}" --body "FACTORY_CUSTOMER_DELIVERY_FAILED $RUN_ID
          Customer product delivery failed in workflow run $GITHUB_RUN_ID. No successful completion evidence was recorded.\n          Repair-Diagnostics: workflow=$GITHUB_RUN_ID;job=$GITHUB_JOB;attempt=$GITHUB_RUN_ATTEMPT;repository=$TARGET_REPOSITORY"
      - name: Record verified completion
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$SOURCE_ISSUE" --repo "${{ github.repository }}" --body "FACTORY_SLICE_COMPLETED $RUN_ID customer-product
          Verified customer product was applied, tested and pushed to $TARGET_REPOSITORY."
