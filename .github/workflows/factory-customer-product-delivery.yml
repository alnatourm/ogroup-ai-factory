name: Factory Customer Product Delivery

on:
  repository_dispatch:
    types: [factory-customer-deliver]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Require delivery context
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.targetRepository }}
          SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
          RUN_ID: ${{ github.event.client_payload.runId }}
        run: |
          test -n "$TARGET_REPOSITORY"
          test -n "$SOURCE_ISSUE"
          test -n "$RUN_ID"
      - name: Clone customer repository read-only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.targetRepository }}
        run: gh repo clone "$TARGET_REPOSITORY" /tmp/customer-product
      - name: Apply generated product payload
        run: node scripts/apply-customer-build-result.mjs /tmp/customer-product
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
      - id: meta
        run: echo "artifact=customer-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Package source without git credentials
        run: rm -rf /tmp/customer-product/.git && tar -C /tmp/customer-product -czf /tmp/customer-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: /tmp/customer-source.tgz
          retention-days: 1

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: /tmp/input
      - name: Unpack untrusted source
        run: mkdir -p /tmp/customer-product && tar -C /tmp/customer-product -xzf /tmp/input/customer-source.tgz
      - name: Verify customer product without privileged credentials
        working-directory: /tmp/customer-product
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          FACTORY_CALLBACK_TOKEN: ""
          FACTORY_RAILWAY_API_TOKEN: ""
          FACTORY_TARGET_GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          exec > >(tee /tmp/customer-verification.log) 2>&1
          if [ -f package.json ]; then
            test -f package-lock.json || { echo "Node product must include package-lock.json"; exit 1; }
            npm ci --ignore-scripts
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
            printf 'node\ndependencies,lint-if-present,typecheck-if-present,test-if-present,build-if-present\n' >/tmp/verification-meta
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m compileall -q .
            if [ -f requirements.txt ]; then python -m pip install --disable-pip-version-check -r requirements.txt; fi
            if [ -d tests ]; then python -m pytest -q; fi
            printf 'python\ncompileall,dependencies-if-present,pytest-if-present\n' >/tmp/verification-meta
          else
            echo "Unsupported customer product"; exit 1
          fi
      - name: Package verified source and evidence
        if: success()
        run: |
          tar -C /tmp/customer-product -czf /tmp/verified-source.tgz .
          cp /tmp/customer-verification.log /tmp/verification.log
          cp /tmp/verification-meta /tmp/verification-meta.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/verified-source.tgz
            /tmp/verification.log
            /tmp/verification-meta.txt
          retention-days: 1

  deliver:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.targetRepository }}
      SOURCE_ISSUE: ${{ github.event.client_payload.sourceIssue }}
      RUN_ID: ${{ github.event.client_payload.runId }}
      TENANT_ID: ${{ github.event.client_payload.tenant }}
      FACTORY_CONTROL_API_URL: ${{ secrets.FACTORY_CONTROL_API_URL }}
      FACTORY_CALLBACK_TOKEN: ${{ secrets.FACTORY_CALLBACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/verified
      - name: Clone trusted delivery target
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TARGET_GITHUB_TOKEN }}
        run: gh repo clone "$TARGET_REPOSITORY" /tmp/customer-product
      - name: Replace working tree with verified artifact
        run: |
          find /tmp/customer-product -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C /tmp/customer-product -xzf /tmp/verified/verified-source.tgz
      - name: Commit exact verified artifact
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TARGET_GITHUB_TOKEN }}
        working-directory: /tmp/customer-product
        run: |
          git config user.name "OGroup AI Factory"
          git config user.email "factory@ogroup.ai"
          git add -A
          git diff --cached --quiet && { echo "No implementation change"; exit 1; }
          git commit -m "build: verified customer product $RUN_ID"
          git push origin HEAD:main
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Persist verified testing evidence
        if: env.FACTORY_CONTROL_API_URL != '' && env.FACTORY_CALLBACK_TOKEN != '' && env.TENANT_ID != ''
        working-directory: /tmp/customer-product
        env:
          VERIFIED_STACK_FILE: /tmp/verified/verification-meta.txt
        run: |
          export VERIFIED_STACK="$(sed -n '1p' "$VERIFIED_STACK_FILE")"
          export VERIFIED_CHECKS="$(sed -n '2p' "$VERIFIED_STACK_FILE")"
          node "$GITHUB_WORKSPACE/scripts/report-customer-evidence.mjs"
      - name: Request exact verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$SOURCE_ISSUE" --repo "${{ github.repository }}" --body "FACTORY_DEPLOYMENT_REQUESTED $RUN_ID
          Repository: $TARGET_REPOSITORY
          Commit: $VERIFIED_COMMIT
          Verification workflow: $GITHUB_RUN_ID"
